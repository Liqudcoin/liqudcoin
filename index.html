<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$LIQUD - Maximum Chaos Degen Arcade</title>
    <style>
        /* Base Retro-Futurista Néon */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #05050a;
            /* Grelha Cyberpunk super leve */
            background-image: 
                linear-gradient(rgba(255, 0, 128, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 128, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            color: #ffffff;
            font-family: 'Impact', 'Arial Black', sans-serif;
            padding-top: 50px;
            text-align: center;
        }

        /* Marquise Superior Casino */
        .marquee-container {
            background: linear-gradient(90deg, #ff007f, #990000);
            border-bottom: 3px solid #ffff00;
            color: #ffffff;
            padding: 6px 0;
            font-size: 12px;
            font-weight: bold;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.5);
        }
        .marquee-content {
            display: inline-block;
            white-space: nowrap;
            animation: marqueeEffect 12s linear infinite;
        }
        @keyframes marqueeEffect {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }

        .main-wrapper {
            max-width: 440px;
            margin: 0 auto;
            padding: 15px;
        }

        /* TÍTULO QUE PISCA E MUDA DE COR SÓZINHO */
        .arcade-title-box {
            background: #111;
            border: 4px ridge #ff007f;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 25px;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.4);
        }
        .arcade-title-box h1 {
            font-size: 55px;
            letter-spacing: 4px;
            text-transform: uppercase;
            animation: megaNeonColor 1.5s infinite alternate;
            text-shadow: 3px 3px 0px #000000;
        }
        
        /* Animação de cores néon leve */
        @keyframes megaNeonColor {
            0% { color: #00ffcc; text-shadow: 0 0 15px #00ffcc, 3px 3px 0px #000; }
            33% { color: #ff007f; text-shadow: 0 0 15px #ff007f, 3px 3px 0px #000; }
            66% { color: #ffff00; text-shadow: 0 0 15px #ffff00, 3px 3px 0px #000; }
            100% { color: #ff4a4a; text-shadow: 0 0 15px #ff4a4a, 3px 3px 0px #000; }
        }

        /* CAIXA DE SLOT MACHINE INTERATIVA */
        .slot-machine-container {
            background: linear-gradient(145deg, #1a1a24, #0f0f15);
            border: 5px solid #ffaa00;
            border-radius: 24px;
            padding: 25px 15px;
            margin-bottom: 25px;
            box-shadow: 0 0 30px rgba(255, 170, 0, 0.5), inset 0 0 20px #000;
            position: relative;
            overflow: hidden;
        }
        .slot-window {
            background: #000;
            border: 4px solid #333;
            border-radius: 50%;
            width: 190px;
            height: 190px;
            margin: 0 auto 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: inset 0 0 15px rgba(255,255,255,0.1);
        }
        .logo-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            transition: transform 0.1s ease;
        }
        .jackpot-bounce {
            animation: bounceMascot 0.4s ease-out 3;
        }
        @keyframes bounceMascot {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15) rotate(5deg); }
        }
        .jackpot-badge {
            position: absolute;
            top: -12px;
            left: 15px;
            background: #ffff00;
            color: #000;
            padding: 3px 8px;
            font-weight: bold;
            font-size: 11px;
            border-radius: 4px;
            box-shadow: 2px 2px 0 #000;
            font-family: 'Impact', sans-serif;
        }

        /* Letreiro Dinâmico de Veredicto */
        .arcade-screen {
            background-color: #050508;
            border: 3px solid #00ffcc;
            border-radius: 12px;
            padding: 12px;
            font-family: monospace;
            font-size: 14px;
            font-weight: bold;
            color: #00ffcc;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 10px rgba(0, 255, 204, 0.3);
            margin-bottom: 15px;
        }

        /* Botões Estilo Jogo de Arcada */
        .arcade-btn {
            display: block;
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            color: #ffffff;
            border: none;
            cursor: pointer;
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0px #000;
            box-shadow: 0 6px 0 #000;
            transition: transform 0.05s;
        }
        .arcade-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #000;
        }
        .btn-spin {
            background: linear-gradient(135deg, #ffff00, #ffaa00);
            color: #000000;
            text-shadow: none;
            box-shadow: 0 6px 0 #b37700;
            animation: pulseGlow 1s infinite alternate;
        }
        @keyframes pulseGlow {
            from { box-shadow: 0 6px 0 #b37700, 0 0 10px rgba(255,255,0,0.3); }
            to { box-shadow: 0 6px 0 #b37700, 0 0 20px rgba(255,255,0,0.6); }
        }
        .btn-pump {
            background: linear-gradient(135deg, #00ffcc, #009977);
            color: #000000;
            text-shadow: none;
            box-shadow: 0 6px 0 #005544;
        }
        .btn-x {
            background: linear-gradient(135deg, #00ccff, #0044cc);
            box-shadow: 0 6px 0 #002266;
        }
        .btn-troll {
            background: linear-gradient(135deg, #00ff66, #006622);
            box-shadow: 0 6px 0 #003311;
        }

        /* Painéis de Conteúdo */
        .arcade-card {
            background: rgba(17, 17, 24, 0.9);
            border: 3px solid #ff007f;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            text-align: left;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .arcade-card h4 {
            font-size: 24px;
            color: #ffff00;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .arcade-card p {
            font-family: Arial, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            color: #e1e1e6;
        }

        .footer {
            font-size: 11px;
            color: #555566;
            margin-top: 30px;
            border-top: 2px dashed #333;
            padding-top: 15px;
        }
    </style>
</head>
