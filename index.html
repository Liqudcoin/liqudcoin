<head>

    <style>
        /* Reset e Base Global */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #050508;
            color: #ffffff;
            font-family: 'Impact', 'Segoe UI', Arial, sans-serif;
            overflow-x: hidden;
            padding-top: 45px;
        }

        /* Fundo Cascata Matrix de Texto */
        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            font-family: monospace;
            font-size: 10px;
            color: rgba(255, 74, 74, 0.06);
            word-wrap: break-word;
            pointer-events: none;
            user-select: none;
        }

        /* Marquise de Liquidações Superior */
        .marquee-container {
            background-color: #990000;
            border-bottom: 2px solid #ff4a4a;
            color: #ffffff;
            padding: 6px 0;
            font-size: 13px;
            font-weight: bold;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
        }
        .marquee-content {
            display: inline-block;
            white-space: nowrap;
            animation: marqueeEffect 20s linear infinite;
        }
        @keyframes marqueeEffect {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }
        .marquee-content span {
            color: #ffff00;
        }

        /* Wrapper Principal */

            z-index: 10;

            box-shadow: 0 0 25px rgba(255, 74, 74, 0.4);
            margin-top: 10px;
            margin-bottom: 20px;
            padding: 25px 10px;
            text-align: center;
        }
        .fire-banner h1 {
            font-size: 52px;
            letter-spacing: 4px;
            color: #ffffff;
            text-shadow: 3px 3px 0px #000, 0 0 15px #ff4a4a;

        .fire-banner p {

        .logo-mascot-img {

        @keyframes borderFlash {
            from { border-color: #ffaa00; }

        }
